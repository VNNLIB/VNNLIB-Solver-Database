[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnnfilter"
version = "0.1.1"
description = "Search the VNN-LIB Solver Database for verifiers that support what you need."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VNN-LIB Solver Database" }]
keywords = ["vnnlib", "neural-network-verification", "formal-verification"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vnnfilter = "vnnfilter.cli:main"

[project.urls]
Homepage = "https://github.com/VNNLIB/VNNLIB-Solver-Database"
Repository = "https://github.com/VNNLIB/VNNLIB-Solver-Database"

[tool.setuptools.packages.find]
where = ["src"]
# The tests live beside the code they test, but they are not part of what gets
# installed. Without this, auto-discovery ships `vnnfilter/tests/` inside the
# wheel, and ships it broken: the fixture JSON beside them is not package data,
# so the installed tests reference a file that is not there.
exclude = ["vnnfilter.tests", "vnnfilter.tests.*"]

[tool.setuptools.package-data]
vnnfilter = ["_data/*.json", "py.typed"]

[tool.pytest.ini_options]
# This file describes the vnnfilter distribution, so pytest's target is this
# package's own tests. The collection pipeline and the API in this repository
# are tested by scripts rather than by pytest; tests/README.md says how.
testpaths = ["src/vnnfilter/tests"]
