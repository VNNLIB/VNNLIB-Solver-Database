name: collect (pull request)

# Runs a submitted install.sh, which is untrusted code from a contributor.
#
# So this uses `pull_request`, NOT `pull_request_target`: the job gets a
# read-only token, no secrets, and cannot write to the repository. It cannot
# comment on the pull request either — that is what pr-comment.yml is for,
# which reads this job's artifact and never executes anything from the branch.

on:
  pull_request:
    paths:
      - "solvers/**"

permissions:
  contents: read

concurrency:
  group: pr-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch too, to diff against it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Find the submissions this pull request touches
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # Only the directories that changed: collecting all of them would
          # reinstall every solver in the repository on every pull request.
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                 | grep '^solvers/[^/]\+/[^/]\+/' \
                 | cut -d/ -f1-3 | sort -u)
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs"

      - name: Validate
        # Before installing anything: layout, line endings, shebang,
        # executable bit, solver.toml, and that install.sh names its version.
        # Milliseconds, and a failure here means nothing is installed at all.
        run: |
          [ -n "${{ steps.changed.outputs.dirs }}" ] || exit 0
          python3 scripts/validate.py ${{ steps.changed.outputs.dirs }}

      - name: Install and collect
        run: |
          mkdir -p artifact
          [ -n "${{ steps.changed.outputs.dirs }}" ] || exit 0
          for dir in ${{ steps.changed.outputs.dirs }}; do
            python3 scripts/register.py "$dir" --timeout 1800 \
              >> artifact/results.jsonl
          done

      - name: Render the report
        if: always()
        run: |
          echo "${{ github.event.pull_request.number }}" > artifact/pr-number.txt
          python3 scripts/report.py artifact/results.jsonl > artifact/report.md
          cat artifact/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report
          path: artifact/
          retention-days: 7
