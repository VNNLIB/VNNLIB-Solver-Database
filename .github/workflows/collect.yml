name: collect (main)

# The second collection SUBMITTING.md describes: after a maintainer merges,
# install the solver again on main, record what it reports, and commit it.
#
# The pull request run is advisory — it shows the author what will be recorded.
# This run is the one whose result actually enters the database.

on:
  push:
    branches: [main]
    paths:
      - "solvers/**"
  workflow_dispatch:
    inputs:
      solver_dir:
        description: "One solvers/<id>/<version> to re-collect (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Never two runs committing to data/solvers.json at once.
  group: collect-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to collect
        id: targets
        run: |
          if [ -n "${{ github.event.inputs.solver_dir }}" ]; then
            dirs="${{ github.event.inputs.solver_dir }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push, or a force-push with no usable ancestor: collect
            # everything rather than guessing what changed.
            dirs=$(ls -d solvers/*/*/ 2>/dev/null | sed 's:/$::' | sort -u)
          else
            dirs=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                   | grep '^solvers/[^/]\+/[^/]\+/' \
                   | cut -d/ -f1-3 | sort -u)
          fi
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs"

      - name: Validate
        # Through the environment, not ${{ }}: that substitutes text into the
        # script before bash sees it, so a multi-line value turns every line
        # after the first into its own command.
        env:
          DIRS: ${{ steps.targets.outputs.dirs }}
        run: |
          [ -n "$DIRS" ] || exit 0
          python3 scripts/validate.py $DIRS

      - name: Install and collect
        env:
          DIRS: ${{ steps.targets.outputs.dirs }}
        run: |
          [ -n "$DIRS" ] || exit 0
          for dir in $DIRS; do
            python3 scripts/register.py "$dir" --timeout 1800 >> results.jsonl
          done

      - name: Merge into the database
        run: |
          [ -s results.jsonl ] || exit 0
          python3 scripts/build.py results.jsonl --database data/solvers.json

      - name: Commit
        env:
          DIRS: ${{ steps.targets.outputs.dirs }}
          SHA: ${{ github.sha }}
        run: |
          # build.py leaves the file untouched when nothing changed, so this
          # is the whole no-op check: no diff, no commit.
          if git diff --quiet -- data/solvers.json; then
            echo "no change to data/solvers.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solvers.json
          # Built as a variable so the body is not indented by the YAML block.
          message="Record collected capabilities

          Collected from: $(echo "$DIRS" | tr '\n' ' ')
          Triggered by $SHA."
          git commit -m "$message"
          git push

      - name: Publish the database to PythonAnywhere
        # Here rather than in a workflow watching data/**, because a push made
        # with GITHUB_TOKEN deliberately does not trigger further workflows.
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_API_TOKEN }}
          # eu.pythonanywhere.com for EU-registered accounts.
          PA_HOST: ${{ vars.PA_HOST || 'www.pythonanywhere.com' }}
        run: |
          if [ -z "$PA_TOKEN" ] || [ -z "$PA_USERNAME" ]; then
            echo "no PythonAnywhere secrets set, skipping publish"
            exit 0
          fi
          # Uploaded outside the clone on purpose: writing into the checkout
          # would leave it dirty and the next git pull there would conflict.
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            -F "content=@data/solvers.json" \
            "https://$PA_HOST/api/v0/user/$PA_USERNAME/files/path/home/$PA_USERNAME/solvers.json"
          echo "published to $PA_HOST"

      - name: Report
        if: always()
        run: |
          [ -s results.jsonl ] || exit 0
          python3 scripts/report.py results.jsonl >> "$GITHUB_STEP_SUMMARY"
