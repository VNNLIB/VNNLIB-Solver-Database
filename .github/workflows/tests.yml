name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the --slow job only: real solvers depend on PyPI, so this
    # catches an upstream break without making every PR wait for torch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 deliberately: register.py builds each solver's venv from the
          # interpreter running it, and solvers pin dependencies that have no
          # 3.10 wheels.
          python-version: "3.12"

      - name: Unit tests
        run: |
          python3 tests/unit/collect.py
          python3 tests/unit/validate.py

      - name: Integration test
        run: python3 tests/integration/pipeline.py

      - name: Validate every submission in the repository
        # Nothing is installed here; this is the same static check the
        # pull request workflow gates on.
        run: |
          shopt -s nullglob
          dirs=(solvers/*/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no submissions yet"
            exit 0
          fi
          python3 scripts/validate.py "${dirs[@]}"

  slow:
    # Real solvers: network, minutes, and an outcome that depends on PyPI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/integration/pipeline.py --slow
